name: "publish"
on:
  push:
    tags: ["v*"]

jobs:
  publish-tauri:
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: universal-apple-darwin
            platform: macos-latest
            name: macOS (Universal)
          - target: x86_64-unknown-linux-gnu
            platform: ubuntu-24.04
            name: Linux (x86_64)
          - target: aarch64-unknown-linux-gnu
            platform: ubuntu-24.04-arm
            name: Linux (ARM64)
          - target: x86_64-pc-windows-msvc
            platform: windows-latest
            name: Windows (x86_64)
          - target: aarch64-pc-windows-msvc
            platform: windows-latest
            name: Windows (ARM64)

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Get version
        id: get_version
        uses: battila7/get-version-action@v2

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install dependencies (ubuntu x86)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libx11-dev libxdo-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: install dependencies (ubuntu arm)
        if: matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libx11-dev libxdo-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: import windows certificate
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            New-Item -ItemType directory -Path certificate
            Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
            certutil -decode certificate/tempCert.txt certificate/certificate.pfx
            Remove-Item -path certificate -include tempCert.txt
            Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          } else {
            Write-Host "Windows certificate secrets not set, skipping import."
          }

      - name: configure macOS universal target
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: configure Windows ARM target
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: rustup target add aarch64-pc-windows-msvc

      - uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock', '**/package-lock.json') }}

      - name: install frontend dependencies
        run: npm install

      - name: Change Version
        env:
          VERSION: "${{ steps.get_version.outputs.version-without-v }}"
        run: make change-version

      - name: Disable Updater Artifacts on Linux
        if: runner.os == 'Linux'
        run: |
          sed -i 's/"createUpdaterArtifacts": "v1Compatible"/"createUpdaterArtifacts": false/g' src-tauri/tauri.conf.json

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target ${{matrix.target}}

      - name: Create Windows Portable Zip
        if: matrix.platform == 'windows-latest'
        run: |
          Compress-Archive -Path src-tauri/target/${{matrix.target}}/release/ebook-wordwise.exe -DestinationPath ebook-wordwise-${{ steps.get_version.outputs.version-without-v }}-${{ matrix.target }}-portable.zip

      - name: Upload Windows Portable Zip
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ebook-wordwise-${{ steps.get_version.outputs.version-without-v }}-${{ matrix.target }}-portable.zip
          tag_name: v${{ steps.get_version.outputs.version-without-v }}
